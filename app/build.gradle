plugins {
    id 'com.android.application'
}

def ks = new Properties()
file("../signing/keystore.properties").withInputStream { ks.load(it) }

// versionCode = минуты с 1970 года => всегда растёт, обновление ставится поверх старого.
def vcEnv = System.getenv("KEEPER_VERSION_CODE")
def vnEnv = System.getenv("KEEPER_VERSION_NAME")
def vCode = vcEnv ? vcEnv.toInteger() : (int) (System.currentTimeMillis() / 60000L)
def vName = vnEnv ? vnEnv : "1.0.0"
def envUrl = System.getenv("KEEPER_SERVER_URL")
def serverUrl = envUrl ? envUrl : project.property("KEEPER_SERVER_URL")

android {
    namespace 'app.keeper.wallet'
    compileSdk 34

    defaultConfig {
        applicationId "app.keeper.wallet"
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName
        buildConfigField "String", "SERVER_URL", "\"${serverUrl}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            storeFile file("../signing/keeper.jks")
            storeType "pkcs12"
            storePassword ks['storePassword']
            keyAlias ks['keyAlias']
            keyPassword ks['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

configurations.all {
    // фикс Duplicate class kotlin.*: jdk7/jdk8 уже внутри kotlin-stdlib 1.8+
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // фикс Duplicate class kotlin.* (stdlib 1.8.x vs jdk7/jdk8 1.6.x)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.zxing:core:3.5.3'
}
